<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Songs</title>
</head>
<body>
  <strong>All Songs</strong>
  <ul>
    {% for song in songs %}
    <li><a href="{% url 'music:song' song.slug %}">{{song}}</a> </li>
    {% endfor %}
  </ul>
</body>
</html>
