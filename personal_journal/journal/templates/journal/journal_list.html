{% extends "journal/base.html" %}
{% block title %}Journals{% endblock %}
{% block content %}
  <strong><u><i>All Journals</i></u></strong> <br>
  <ul>
    {% for journal in journals %}
    <li><a href="{% url 'journal:detail' journal.slug %}">{{journal}}</a></li>
    {% endfor %}
  </ul>

    <strong><u><i>Create a new Entry</i></u></strong> <br>
  <ul>
    <li><a href="{% url 'journal:create' %}">New Entry</a></li>
  </ul>
{% endblock %}
