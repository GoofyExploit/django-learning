<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor | Course</title>
</head>
<body>
  <strong>All Courses by {{instructor}}</strong>
  <ul>
    {% for course in courses %}
    <li><a href="{% url 'courses:course' course.slug %}">{{course}}</a></li>
    {% endfor %}
  </ul>
</body>
</html>
