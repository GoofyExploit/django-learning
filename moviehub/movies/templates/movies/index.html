<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies</title>
</head>
<body>
  <h1>All the movies in our collection: </h1>
  <ol>
    {% for movie in movies %}
      <li><a href="{% url 'movies:detail' movie.slug %}">{{movie.title}}</a> - {{movie.year}}</li>
    {% endfor %}
  </ol>

</body>
</html>
