<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Places</title>
</head>
<body>
  <strong>Tourist places in {{country}}</strong>
  <ul>
    {% for place in places %}
    <li><a href="{% url 'travel:place' country place.slug %}">{{place}}</a></li>
    {% endfor %}
  </ul>
</body>
</html>
