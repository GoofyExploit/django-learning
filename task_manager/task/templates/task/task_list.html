<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Tasks</title>
</head>
<body>
  <strong><i><u>All Tasks</u></i></strong>
  <ul>
    {% for task in tasks %}
    <li><a href="{% url 'task:detail' task.slug %}">{{task}}</a></li>
    {% endfor %}
  </ul>
</body>
</html>
