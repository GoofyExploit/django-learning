{% load static %}
<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="{% static 'notes/style.css' %}" />
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="{% url 'notes:index' %}">Home</a></li>
        <li><a href="{% url 'notes:about' %}">About</a></li>
        <li><a href="{% url 'notes:contact' %}">Contact</a></li>
      </ul>
    </nav>
    <main>{% block content %} {% endblock %}</main>
    <footer>
      <hr>
      <p>&copy; Notes 2026</p>
    </footer>
  </body>
</html>
