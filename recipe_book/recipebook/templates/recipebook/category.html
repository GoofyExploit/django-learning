<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category</title>
</head>
<body>
  <h1>{{category}}</h1>
  <ul>
    {% for recipe in recipes %}
    <li><a href="{% url 'recipebook:detail' recipe.slug %}">{{recipe.name}}</a></li>
    {% endfor %}
  </ul>
</body>
</html>
